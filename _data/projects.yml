# Projects on the home page.
#
# The page shows these sections in this order, and the items in each section
# in this order. To reorder, cut and paste whole blocks.
#
# Add a section: copy a "- section:" block, including its items.
# Add an item:   copy one "- title:" block inside a section's items.
#
#   title        the heading (required)
#   url          where the title links (optional)
#   meta         a short line under the title, e.g. the journal and year (optional)
#   description  a sentence or two (optional). Markdown works: *italics*,
#                `code`, [a link](https://example.com). Keep the ">" and indent.
#   links        extra links under the description (optional), each with a
#                label and a url
#
# Indentation matters: use spaces, never tabs, and line things up as below.
# If a line has a colon or starts with a quote mark, wrap it in "double quotes".

