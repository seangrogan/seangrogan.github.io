name: Build and publish site

on:
  push:                      # any branch: fetches posts and checks the site builds
  schedule:
    - cron: "23 10 * * *"   # daily, around 5-6 am Toronto time
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write            # to save new posts back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch newsletter posts
        run: |
          pip install feedparser pyyaml curl_cffi
          python scripts/fetch_posts.py

      - name: Save new posts to the repo
        id: save
        run: |
          if [ -n "$(git status --porcelain _data/posts.yml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/posts.yml
            git commit -m "Update newsletter posts"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The daily check only rebuilds when there's a new post.
      # A push or a manual run always rebuilds.
      - name: Decide whether to rebuild
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.save.outputs.changed }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Rebuilding the site."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No new posts, so the site is left as it is."
          fi

      - if: steps.decide.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.decide.outputs.publish == 'true'
        uses: actions/jekyll-build-pages@v1
      - if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4

  deploy:
    # only main goes live, and only when there's something new to publish
    if: github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
